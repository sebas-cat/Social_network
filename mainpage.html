        <!--MENÚ LATERAL IZQUIERDO-->
        <div class="div-op">
            <ul>

                <!--Opciones panel de la izquierda-->
                <li><a href="#"><img src="https://cdn-icons-png.flaticon.com/512/54/54481.png"> Buscar</a></li>

            <!-- Título sección de posts -->
            <h3 class="post-title">Nuevos Posts</h3>


        </section>
